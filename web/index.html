<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flowers</title>
  <style>
    @font-face {
      font-family: "GameFont";
      src: url("fonts/GameFont.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #090414;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "GameFont", sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background: #000;
      box-shadow: 0 0 36px rgba(150, 90, 255, 0.35);
      touch-action: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <script src="game.js"></script>
</body>
</html>
