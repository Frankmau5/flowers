name: Build Desktop Executables (Windows, Linux, macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
            asset_name: Flowers-Linux
            sep: ":"
          - os: windows-latest
            platform: Windows
            asset_name: Flowers-Windows
            sep: ";"
          - os: macos-latest
            platform: macOS
            asset_name: Flowers-macOS
            sep: ":"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build single-file executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "${{ matrix.asset_name }}" --add-data "imgs${{ matrix.sep }}imgs" --add-data "fonts${{ matrix.sep }}fonts" main.py

      - name: Upload Desktop Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}*
